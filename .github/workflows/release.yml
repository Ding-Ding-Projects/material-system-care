name: Windows build and release
on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the explicitly verified main candidate
        type: boolean
        default: false
      candidate_sha:
        description: Exact verified main commit SHA required for publication
        type: string
        required: false
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Record start and unique version
        shell: pwsh
        run: |
          "WORKFLOW_STARTED=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          "BUILD_VERSION=0.1.${{ github.run_number }}.${{ github.run_attempt }}" >> $env:GITHUB_ENV
      - name: Build and package
        shell: cmd
        run: build-installer.bat /s
      - name: Publish unique release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          SELECTED_CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          & ./scripts/check-release-readiness.ps1 -Candidate $env:SELECTED_CANDIDATE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $end=[DateTime]::UtcNow
          $elapsed=$end-[DateTime]::Parse($env:WORKFLOW_STARTED)
          $notes="Unsigned Squirrel.Windows installer. Unknown-publisher and SmartScreen warnings may appear.`n`nWorkflow started: $env:WORKFLOW_STARTED`nWorkflow completed: $($end.ToString('o'))`nWorkflow duration: $($elapsed.ToString('hh\:mm\:ss'))`n`nThis workflow builds and packages. It runs no tests or lint. Publication requires explicit selection of this verified main candidate and its recorded capability evidence."
          $notes | Set-Content release-notes.txt
          gh release create "v$env:BUILD_VERSION" artifacts/installer/releases/Setup.exe artifacts/installer/releases/RELEASES artifacts/installer/releases/*-full.nupkg --title "Material System Care $env:BUILD_VERSION" --notes-file release-notes.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect safe build evidence
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/evidence | Out-Null
          @{run='${{ github.run_id }}';source='${{ github.sha }}';status='${{ job.status }}';runner='${{ runner.os }}'} | ConvertTo-Json | Set-Content artifacts/evidence/run.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-build-evidence
          path: |
            artifacts/installer/releases/
            artifacts/windows-x64/build-receipt.json
            artifacts/evidence/
          if-no-files-found: warn
          retention-days: 7
